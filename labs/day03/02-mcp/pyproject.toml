[project]
name = "workshop-inventory-mcp"
version = "0.1.0"
description = "Local MCP inventory workshop"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mcp>=2,<3",
    "mistralai-agents==1.1.0",
    "uvicorn>=0.30,<1",
    "python-dotenv>=1,<2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
